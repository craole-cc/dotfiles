theme = "base16_transparent"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[keys.insert]
A-e = "normal_mode"
A-f = ["normal_mode", ":format"]
A-q = ["normal_mode", ":quit"]
A-space = "normal_mode"
A-w = ["normal_mode", ":write"]

[keys.normal]
A-e = ["collapse_selection", "keep_primary_selection"]
A-f = ["collapse_selection", "keep_primary_selection", ":format"]
A-j = ["extend_to_line_bounds", "delete_selection", "paste_after"]
A-k = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
A-q = ":quit"
A-w = ["collapse_selection", "keep_primary_selection", ":write"]
C-S-esc = "extend_line"
"C-]" = "indent"
C-s = ":write"
esc = ["collapse_selection", "keep_primary_selection"]
ret = ["open_below", "normal_mode"]

[keys.normal.g]
u = ":lsp-restart"

[keys.normal.space]
A-d = [":cd %sh{printenv DOTS}", "file_picker_in_current_directory"]
o = [':sh mkdir -p "$(printenv XDG_RUNTIME_DIR || printenv TMPDIR || echo "$HOME/.cache")" && rm -f "$(printenv XDG_RUNTIME_DIR || printenv TMPDIR || echo "$HOME/.cache")/helix-yazi-choice" "$(printenv XDG_RUNTIME_DIR || printenv TMPDIR || echo "$HOME/.cache")/helix-yazi-cwd"', ':insert-output yazi --chooser-file="$(printenv XDG_RUNTIME_DIR || printenv TMPDIR || echo "$HOME/.cache")/helix-yazi-choice" --cwd-file="$(printenv XDG_RUNTIME_DIR || printenv TMPDIR || echo "$HOME/.cache")/helix-yazi-cwd"', ''':sh printf '\033[?1049h\033[?2004h' > /dev/tty''', ':cd %sh{cat "$(printenv XDG_RUNTIME_DIR || printenv TMPDIR || echo "$HOME/.cache")/helix-yazi-cwd"}', ':open %sh{cat "$(printenv XDG_RUNTIME_DIR || printenv TMPDIR || echo "$HOME/.cache")/helix-yazi-choice"}', ":set mouse false", ":set mouse true", ":redraw"]
space = "file_picker_in_current_directory"

[keys.select]
A-e = ["collapse_selection", "keep_primary_selection", "normal_mode"]
A-f = ["collapse_selection", "keep_primary_selection", "normal_mode", ":format"]
A-q = ["normal_mode", ":quit"]
A-w = ["collapse_selection", "keep_primary_selection", "normal_mode", ":write"]

